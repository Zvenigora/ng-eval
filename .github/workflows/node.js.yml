# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Node 24 and 26 ship npm 11 and 12 respectively and are tested here.
        # Node 22 is supported at runtime but bundles npm 10, which cannot read
        # this lockfile and fails `npm ci` with EUSAGE. Therefore Node 22 is
        # excluded from CI testing; contributors using Node 22 must upgrade npm
        # first with `npm i -g npm@11`. See CONTRIBUTING.md Prerequisites.
        node-version: [24.x, 26.x]

    steps:
    - uses: actions/checkout@v5
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v5
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run build --if-present
    - run: npm test
