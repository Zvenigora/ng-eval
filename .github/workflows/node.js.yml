# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Node 24 and 26 ship npm 11 and 12. npm 10 cannot read this
        # lockfile - it reports @types/node, yaml and undici-types as
        # missing and fails `npm ci` with EUSAGE - so Node 22, which
        # bundles npm 10, is excluded even though Angular 22 supports it.
        # A Node 22 contributor needs `npm i -g npm@11` first; see the
        # "engines" field in package.json.
        node-version: [24.x, 26.x]

    steps:
    - uses: actions/checkout@v5
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v5
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run build --if-present
    - run: npm test
